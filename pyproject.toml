[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-mcp"
version = "0.1.0"
description = "A Model Context Protocol server for Garmin Connect health and fitness data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.14"
authors = [
    {name = "Shawn Duggan"}
]
keywords = ["garmin", "mcp", "fitness", "health", "claude", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "garminconnect>=0.2.0",
    "garth>=0.4.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/shawnduggan/garmin-mcp"
Repository = "https://github.com/shawnduggan/garmin-mcp"
Issues = "https://github.com/shawnduggan/garmin-mcp/issues"

[project.scripts]
garmin-mcp = "garmin_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
